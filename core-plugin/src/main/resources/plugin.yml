name: '${pluginName}'
version: '${version}'
main: org.yuemi.mmoaccessories.plugin.AccessoriesPlugin
authors: [${authors}]
contributors: [${contributors}]
api-version: '${apiVersion}'
softdepend: [
  YueMiLibs,
  MmoItems,
  MmoMechanics
]
commands:
  accessories:
    description: Open the accessories GUI
    usage: /accessories
    aliases: [acc]
    permission: accessories.open
permissions:
  accessories.open:
    description: Allows opening the accessories GUI
    default: true
