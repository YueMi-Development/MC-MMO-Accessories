name: '${pluginName}'
version: '${version}'
main: org.yuemi.mmoaccessories.plugin.AccessoriesPlugin
authors: [${authors}]
contributors: [${contributors}]
api-version: '${apiVersion}'
softdepend: [
  YueMiLibs,
  MmoItems,
  MmoMechanics
]
bstats-id: '${bstatsPluginId}'
commands:
  accessories:
    description: Main command for MC-MMO-Accessories
    aliases: [acc]
    usage: /accessories <subcommand>
permissions:
  accessories.command.open:
    description: Open your own accessories GUI
    default: true
  accessories.command.reload:
    description: Reload plugin config
    default: op
  accessories.command.list:
    description: List a player's accessories
    default: op
  accessories.command.view:
    description: Open another player's accessories GUI
    default: op
  accessories.command.wipe:
    description: Wipe a player's accessories
    default: op
